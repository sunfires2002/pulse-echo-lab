name: Publish standalone LAB
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: lab-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'sunfires2002/pulse-echo-lab'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - run: python3 tools/prepare-pages.py
      - run: python3 tools/audit-bundle.py dist
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
